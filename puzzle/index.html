<!DOCTYPE html>
<html lang="en">
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Puzzle Game</title>
    <!-- Stylesheet -->
    <link rel="stylesheet" href="puzzle.css" />
    <script src="puzzle.js"></script>
  </head>
  <body>
    <div class="container">
      <div class="title">
        <h1 class="gameTitle">Sliding Puzzle</h1>
        <div class="levelBtnBox">
          <button class="gameLevelBtn" id="easy" disabled>EASY</button>
          <button class="gameLevelBtn" id="medium" disabled>MEDIUM</button>
          <button class="gameLevelBtn" id="hard" disabled>HARD</button>
        </div>
      </div>
      <div class="box" id="box">
        <div class="leftContainer">
          <button class="btn" id="start">Start</button>
          <button class="btn" id="reset">Reset</button>
          <p class="turnText">Turns: <span id="turns">0</span></p>
        </div>
  
        <div class="rightContainer">
          <div class="board" id="puzzleContainer">
            <img class="puzzleImage" src="images/sunset.png" alt="Sunset over the sea" />
          </div>
          <div class="board">
            <img class="puzzleImage" id="fixedImg" src="images/sunset.png" alt="Sunset over the sea" />
          </div>
        </div>
      </div>
      <div class="bottom">
      </div>
    </div>
  </body>
</html>
